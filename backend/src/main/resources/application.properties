spring.application.name=backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/al_learning}
spring.datasource.username=${DB_USERNAME:al_admin}
spring.datasource.password=${DB_PASSWORD:al_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — Flyway manages DDL; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# Security / JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail configuration (falls back to console logging if SMTP_HOST is not set)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email verification
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.email.verification.expiry-hours=${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

# Orders & Delivery
app.order.payment-timeout-minutes=${ORDER_PAYMENT_TIMEOUT_MINUTES:30}
app.delivery.flat-fee=${DELIVERY_FLAT_FEE:0.00}